<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Achi's creation - Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --cream: #FDF8F0; --warm-white: #FFFCF7; --terracotta: #C4715A; --chocolate: #4A2C1A; --ink: #1A0F08; --shadow: rgba(74,44,26,0.12); }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'DM Sans', sans-serif; }
  body { background: var(--cream); color: var(--ink); padding: 40px 20px; }
  .admin-container { max-width: 800px; background: var(--warm-white); margin: 0 auto; padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px var(--shadow); }
  h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--terracotta); text-align: center; margin-bottom: 30px; }
  .form-group { margin-bottom: 22px; }
  label { display: block; font-size: 0.88rem; font-weight: 500; color: var(--chocolate); margin-bottom: 8px; }
  input[type="text"], input[type="number"], select { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid rgba(74,44,26,0.15); background: transparent; font-size: 0.95rem; outline: none; }
  .file-drop-area { position: relative; display: flex; align-items: center; justify-content: center; padding: 25px; border: 2px dashed rgba(196,113,90,0.4); border-radius: 12px; background: rgba(253,248,240,0.5); cursor: pointer; text-align: center; }
  .file-input { position: absolute; left: 0; top: 0; height: 100%; width: 100%; opacity: 0; cursor: pointer; }
  .btn-submit { width: 100%; background: var(--terracotta); color: white; padding: 16px; border: none; border-radius: 50px; font-size: 1rem; font-weight: 500; cursor: pointer; margin-top: 10px; }
  .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
  #statusMessage { text-align: center; margin-top: 15px; font-weight: 500; }
  .success { color: #27ae60; } .error { color: #c0392b; }
  
  /* Management List Styles */
  hr { border: none; border-top: 1px solid rgba(74,44,26,0.15); margin: 40px 0; }
  .item-list { display: flex; flex-direction: column; gap: 15px; }
  .admin-item { display: flex; align-items: center; justify-content: space-between; background: white; padding: 15px; border-radius: 12px; border: 1px solid rgba(74,44,26,0.1); }
  .item-info { display: flex; align-items: center; gap: 15px; }
  .item-info img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
  .item-title { font-weight: bold; color: var(--ink); }
  .item-price { font-size: 0.85rem; color: var(--chocolate); }
  .item-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .action-btn { padding: 6px 12px; border: none; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: 500; transition: 0.2s; }
  .btn-hide { background: #f39c12; color: white; }
  .btn-stock { background: #3498db; color: white; }
  .btn-delete { background: #e74c3c; color: white; }
  .action-btn:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="admin-container">
  <h2>Add New Design 🎨</h2>
  <form id="uploadForm">
    <div class="form-group"><label>Design Name</label><input type="text" id="designName" required></div>
    <div class="form-group"><label>Price (LKR)</label><input type="number" id="designPrice" required></div>
    <div class="form-group">
      <label>Category</label>
      <select id="designCategory" required>
        <option value="" disabled selected>Select Category</option>
        <option value="saree">Saree</option><option value="batik">Batik</option><option value="kurta">Kurta</option>
      </select>
    </div>
    <div class="form-group">
      <div class="file-drop-area"><span id="fileLabel">📸 Choose Image</span><input class="file-input" type="file" id="designImage" accept="image/*" required></div>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">✦ Add Design</button>
  </form>
  <div id="statusMessage"></div>

  <hr>
  <h2>Manage Designs 🛠️</h2>
  <div class="item-list" id="adminItemsList">
    <p style="text-align:center; color:gray;">Loading designs...</p>
  </div>
</div>

<script type="module">
  // මෙතන Storage අයින් කරලා Firestore විතරක් තියෙනවා
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, query, orderBy, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // ඔයාගේ Firebase Config එක
  const firebaseConfig = {
    apiKey: "AIzaSyCN--jld9RjWhTCanIlqvHd_V7PuSGR_Ic",
    authDomain: "achis-creat.firebaseapp.com",
    projectId: "achis-creat",
    storageBucket: "achis-creat.firebasestorage.app",
    messagingSenderId: "406821809545",
    appId: "1:406821809545:web:d67f7a8d6c50c3ad408558"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  // ඔයාගේ ImgBB API Key එක
  const imgbbApiKey = "73fff8dfce6ca7106d714fd18beccd65";

  // File තේරුවාම නම පෙන්නන්න
  document.getElementById('designImage').addEventListener('change', function() {
    if(this.files[0]) document.getElementById('fileLabel').innerText = "✅ " + this.files[0].name;
  });

  // Form Submit කරද්දි 
  document.getElementById('uploadForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');
    
    submitBtn.disabled = true; 
    submitBtn.innerText = "Uploading Image...";
    statusMsg.innerText = "";
    
    const name = document.getElementById('designName').value;
    const price = document.getElementById('designPrice').value;
    const category = document.getElementById('designCategory').value;
    const imageFile = document.getElementById('designImage').files[0];

    // 1. පින්තූරය ImgBB එකට යැවීම
    const formData = new FormData();
    formData.append("image", imageFile);

    try {
      const response = await fetch("https://api.imgbb.com/1/upload?key=" + imgbbApiKey, {
        method: "POST",
        body: formData
      });
      const data = await response.json();

      if(data.success) {
        const imageUrl = data.data.display_url; // ImgBB එකෙන් දෙන ලින්ක් එක
        
        submitBtn.innerText = "Saving to Database...";

        // 2. විස්තර Firebase එකට සේව් කිරීම
        await addDoc(collection(db, "designs"), {
          name: name, 
          price: price, 
          category: category, 
          imageUrl: imageUrl, // අර ImgBB ලින්ක් එක දානවා
          isHidden: false, 
          inStock: true,
          createdAt: serverTimestamp()
        });

        statusMsg.className = "success";
        statusMsg.innerText = "🎉 Design Added Successfully!";
        document.getElementById('uploadForm').reset();
        document.getElementById('fileLabel').innerText = "📸 Choose Image";

      } else {
        throw new Error("Image Upload Failed");
      }
    } catch (error) {
      console.error(error);
      statusMsg.className = "error";
      statusMsg.innerText = "❌ Something went wrong. Try again.";
    } finally {
      submitBtn.disabled = false; 
      submitBtn.innerText = "✦ Add Design";
    }
  });

  // Load and Manage Items Logic
  const listContainer = document.getElementById('adminItemsList');
  const q = query(collection(db, "designs"), orderBy("createdAt", "desc"));
  
  onSnapshot(q, (snapshot) => {
    listContainer.innerHTML = '';
    if(snapshot.empty) { listContainer.innerHTML = '<p style="text-align:center;">No designs found.</p>'; return; }
    
    snapshot.forEach((documentSnapshot) => {
      const data = documentSnapshot.data();
      const docId = documentSnapshot.id;
      
      const hideText = data.isHidden ? "👁️ Unhide" : "🚫 Hide";
      const stockText = data.inStock ? "📉 Mark Out of Stock" : "📈 Mark In Stock";
      const itemOpacity = data.isHidden ? "0.5" : "1";

      listContainer.innerHTML += `
        <div class="admin-item" style="opacity: ${itemOpacity};">
          <div class="item-info">
            <img src="${data.imageUrl}" alt="img">
            <div>
              <div class="item-title">${data.name} ${data.isHidden ? '(Hidden)' : ''}</div>
              <div class="item-price">Rs. ${data.price} | ${data.inStock ? '✅ In Stock' : '❌ Out of Stock'}</div>
            </div>
          </div>
          <div class="item-actions">
            <button class="action-btn btn-stock" onclick="toggleStock('${docId}', ${data.inStock})">${stockText}</button>
            <button class="action-btn btn-hide" onclick="toggleHide('${docId}', ${data.isHidden})">${hideText}</button>
            <button class="action-btn btn-delete" onclick="deleteItem('${docId}')">🗑️ Delete</button>
          </div>
        </div>
      `;
    });
  });

  window.toggleHide = async (id, currentStatus) => { await updateDoc(doc(db, "designs", id), { isHidden: !currentStatus }); };
  window.toggleStock = async (id, currentStatus) => { await updateDoc(doc(db, "designs", id), { inStock: !currentStatus }); };
  window.deleteItem = async (id) => { if(confirm("Are you sure you want to delete this design forever?")) { await deleteDoc(doc(db, "designs", id)); } };
</script>
</body>
</html>
